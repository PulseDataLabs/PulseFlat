name: CI - Testes e Qualidade de Código

on:
  push:
    branches: [ main ]
    paths-ignore:
      - 'data/**'
      - 'README.md'
      - 'assets/**'
      - 'index.html'
      - 'consulta.html'
  pull_request:
    branches: [ main ]
    paths-ignore:
      - 'data/**'
      - 'README.md'
      - 'assets/**'
      - 'index.html'
      - 'consulta.html'

concurrency:
  group: pulseflat-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Testes e Linting
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
    - name: Checkout do código
      uses: actions/checkout@v4

    - name: Configurar Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.13'
        cache: 'pip'

    - name: Instalar dependências
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
        pip install ruff

    - name: Executar Linting (Ruff)
      run: ruff check .

    - name: Executar Testes Unitários e de Integração (Pytest)
      run: pytest
