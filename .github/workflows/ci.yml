name: CI - Testes e Qualidade de Código

on:
  push:
    branches: [ main ]
    paths-ignore:
      - 'data/**'
      - 'README.md'
      - 'assets/**'
      - 'index.html'
      - 'consulta.html'
  pull_request:
    branches: [ main ]
    paths-ignore:
      - 'data/**'
      - 'README.md'
      - 'assets/**'
      - 'index.html'
      - 'consulta.html'

concurrency:
  group: pulseflat-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Testes e Linting
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
    - name: Checkout do código
      uses: actions/checkout@v4
      with:
        ref: ${{ github.head_ref || github.ref_name }}

    - name: Configurar Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.13'
        cache: 'pip'

    - name: Instalar dependências
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
        pip install ruff

    - name: Executar Linting (Ruff) com Auto-fix
      run: |
        ruff check --fix .
        if [ -n "$(git status --porcelain)" ] && [ "${{ github.event_name }}" = "push" ]; then
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "style: auto-fix linting issues via ruff [skip ci]"
          git push || true
        fi
        ruff check .

    - name: Executar Testes Unitários e de Integração (Pytest)
      run: pytest
