name: Executar Automação de Dados Diária

on:
  schedule:
    # Horários convertidos para UTC (Horário de Brasília + 3 horas)
    
    # 06h03, 08h03 e 09h03 de Segunda a Sexta (UTC: 09h03, 11h03 e 12h03)
    - cron: '3 9,11,12 * * 1-5'
    
    # 09h33, 10h33 e 11h33 de Segunda a Sexta (UTC: 12h33, 13h33 e 14h33)
    - cron: '33 12,13,14 * * 1-5'
    
    # 18h03 de Segunda a Sexta (UTC: 21h03)
    - cron: '3 21 * * 1-5'
    
    # 21h03 e 23h03 de Segunda a Sexta (No UTC vira 00h03 e 02h03 de Terça a Sábado)
    - cron: '3 0,2 * * 2-6'
  
  # Permite execução manual pelo painel do GitHub
  workflow_dispatch:

concurrency:
  group: pulseflat-daily
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    # Dá permissão para o token do GitHub Actions fazer alterações no repositório (Push)
    permissions:
      contents: write

    steps:
    - name: Checkout do código
      uses: actions/checkout@v4

    - name: Configurar Fuso Horário Local
      run: sudo timedatectl set-timezone America/Sao_Paulo

    - name: Configurar Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.13'
        cache: 'pip'

    - name: Instalar dependências
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    # Executa o script que vai atualizar ou criar os CSVs dentro de ./data
    - name: Executar script de processamento
      env:
        ORACLE_DB_DSN: ${{ secrets.ORACLE_DB_DSN || vars.ORACLE_DB_DSN }}
        ORACLE_DB_USER: ${{ secrets.ORACLE_DB_USER || vars.ORACLE_DB_USER }}
        ORACLE_DB_PASSWORD: ${{ secrets.ORACLE_DB_PASSWORD || vars.ORACLE_DB_PASSWORD }}
        ORACLE_DB_WALLET_PASSWORD: ${{ secrets.ORACLE_DB_WALLET_PASSWORD || vars.ORACLE_DB_WALLET_PASSWORD }}
        ORACLE_DB_WALLET_BASE64: ${{ secrets.ORACLE_DB_WALLET_BASE64 || vars.ORACLE_DB_WALLET_BASE64 }}
        ANBIMA_CLIENT_ID: ${{ secrets.ANBIMA_CLIENT_ID || vars.ANBIMA_CLIENT_ID }}
        ANBIMA_CLIENT_SECRET: ${{ secrets.ANBIMA_CLIENT_SECRET || vars.ANBIMA_CLIENT_SECRET }}
        EULERPOOL_API_KEY: ${{ secrets.EULERPOOL_API_KEY || vars.EULERPOOL_API_KEY }}
      # O "|| true" força o terminal a entender que a execução terminou com sucesso mesmo se o Python falhar
      run: |
        if [ -n "$ORACLE_DB_WALLET_BASE64" ]; then
          echo "Processando carteira mTLS..."
          mkdir -p /tmp/oracle_wallet
          echo "$ORACLE_DB_WALLET_BASE64" | base64 -d > /tmp/oracle_wallet.zip
          unzip -o /tmp/oracle_wallet.zip -d /tmp/oracle_wallet
          export ORACLE_DB_WALLET_DIR=/tmp/oracle_wallet
          echo "Wallet extraída com sucesso para $ORACLE_DB_WALLET_DIR"
        else
          echo "Aviso: ORACLE_DB_WALLET_BASE64 não está configurada."
        fi
        python run_all.py --parallel --max-workers 8 || true

    # Verifica e resolve integridade das séries temporais via backfill automático
    - name: Verificar e resolver integridade das séries temporais
      run: python scripts/verificar_buracos.py --resolve || true

    # Identifica mudanças na pasta data/ e faz o push se houver novos dados
    - name: Commitar e enviar novas alterações de dados
      run: |
        # Configura o Git com o usuário padrão do robô do GitHub
        git config --global user.name "github-actions[bot]"
        git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
        
        # Adiciona apenas as modificações da pasta data
        git add data/
        
        if ! git diff --cached --quiet; then
          git commit -m "Bot: Atualização automática de dados [skip ci]"
          
          # Push com retry resiliente contra alterações remotas concorrentes
          pushed=false
          for i in 1 2 3 4 5; do
            if git push origin main; then
              echo "Push realizado com sucesso!"
              pushed=true
              break
            fi
            echo "Push falhou (possível alteração remota). Sincronizando com rebase..."
            if ! git pull --rebase -X theirs origin main; then
              git rebase --abort || true
              git fetch origin main
              git reset --soft origin/main
              git add data/
              git commit -m "Bot: Atualização automática de dados [skip ci]" || true
            fi
            sleep 3
          done
          
          if [ "$pushed" = false ]; then
            echo "Falha ao enviar alterações após 5 tentativas."
            exit 1
          fi
        else
          echo "Nenhuma alteração nos dados hoje."
        fi
